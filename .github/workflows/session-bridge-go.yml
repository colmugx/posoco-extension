name: Posoco Session Bridge (Go)

on:
  pull_request:
    paths:
      - 'posoco-ext-session-bridge/go/**'
      - '.github/workflows/session-bridge-go.yml'
  push:
    paths:
      - 'posoco-ext-session-bridge/go/**'
      - '.github/workflows/session-bridge-go.yml'

jobs:
  go:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: posoco-ext-session-bridge/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go vet ./...
      - run: go test -race ./...
