name: HawDB SessionStore codec contract

on:
  push:
    branches: [feat/hawdb-session-store]
    paths:
      - "posoco-ext-fs-session/**"
      - ".github/workflows/hawdb-session-codec.yml"
  pull_request:
    paths:
      - "posoco-ext-fs-session/**"
      - ".github/workflows/hawdb-session-codec.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codec:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Checkout rolling HawDB module (unpublished)
        uses: actions/checkout@v4
        with:
          repository: colmugx/hawdb
          ref: feat/moonbit-native-sdk
          path: _hawdb_checkout
      - name: Install current MoonBit
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check session codec with current dependencies
        shell: bash
        run: |
          set -euo pipefail
          moon version --all
          python3 - <<'PY'
          from pathlib import Path
          p = Path("moon.work")
          lines = p.read_text().splitlines()
          assert lines[0].strip() == "members = ["
          extra = '  "./_hawdb_checkout/bindings/moonbit",'
          assert extra not in lines
          lines.insert(1, extra)
          p.write_text(chr(10).join(lines) + chr(10))
          PY
          moon update
          moon check --target native posoco-ext-fs-session
          moon test --target native posoco-ext-fs-session
