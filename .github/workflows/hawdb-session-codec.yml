name: HawDB SessionStore codec contract

on:
  push:
    branches: [main]
    paths:
      - "posoco-ext-fs-session/**"
      - ".github/workflows/hawdb-session-codec.yml"
  pull_request:
    paths:
      - "posoco-ext-fs-session/**"
      - ".github/workflows/hawdb-session-codec.yml"
  workflow_dispatch:

concurrency:
  # Preserve mainline verification, but cancel superseded revisions of the same PR.
  group: hawdb-session-codec-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  codec:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install current MoonBit
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check session codec with current dependencies
        shell: bash
        run: |
          set -euo pipefail
          moon version --all
          moon update
          moon check --target native posoco-ext-fs-session
          moon test --target native posoco-ext-fs-session
