name: HawDB native Posoco SessionStore integration

on:
  push:
    branches: [main]
    paths:
      - "posoco-ext-fs-session/**"
      - "posoco-ext-hawdb-session/**"
      - "moon.work"
      - ".github/workflows/hawdb-session-native.yml"
  pull_request:
    paths:
      - "posoco-ext-fs-session/**"
      - "posoco-ext-hawdb-session/**"
      - "moon.work"
      - ".github/workflows/hawdb-session-native.yml"
  workflow_dispatch:

concurrency:
  # PR revisions may supersede obsolete checks; production mainline runs never do.
  group: hawdb-session-native-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unix-native:
    name: Upstream HawDB + Posoco native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout current upstream HawDB main
        uses: actions/checkout@v4
        with:
          repository: nowledge-co/hawdb
          ref: main
          path: _hawdb_checkout
      - name: Checkout current upstream Posoco main
        uses: actions/checkout@v4
        with:
          repository: colmugx/posoco
          ref: main
          path: _posoco_checkout
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: _hawdb_checkout/bindings/moonbit/native
      - name: Install current MoonBit
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Assemble workspace and check native MoonBit
        shell: bash
        run: |
          set -euo pipefail
          python3 posoco-ext-hawdb-session/tools/assemble_workspace.py
          git -C _hawdb_checkout rev-parse HEAD
          moon version --all
          rustc --version
          moon update
          moon check --target native posoco-ext-hawdb-session
      - name: Build and test current upstream HawDB MoonBit Rust adapter
        shell: bash
        working-directory: _hawdb_checkout/bindings/moonbit/native
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --release --lib
          cargo build --release
          test -s target/release/libhawdb_moonbit.a
      - name: Configure and run real Posoco SessionStore native integration
        shell: bash
        run: |
          set -euo pipefail
          python3 posoco-ext-hawdb-session/tools/configure_native_link.py
          moon test --target native posoco-ext-hawdb-session

  windows-native:
    name: Upstream HawDB + Posoco native (Windows MSVC)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Preserve checkout line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Checkout current upstream HawDB main
        uses: actions/checkout@v4
        with:
          repository: nowledge-co/hawdb
          ref: main
          path: _hawdb_checkout
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Checkout current upstream Posoco main
        uses: actions/checkout@v4
        with:
          repository: colmugx/posoco
          ref: main
          path: _posoco_checkout
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: _hawdb_checkout/bindings/moonbit/native
      - name: Install current MoonBit for Windows
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Assemble workspace and check native MoonBit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python posoco-ext-hawdb-session/tools/assemble_workspace.py
          if ($LASTEXITCODE -ne 0) { throw "Workspace assembly failed" }
          git -C _hawdb_checkout rev-parse HEAD
          moon version --all
          rustc --version
          moon update
          if ($LASTEXITCODE -ne 0) { throw "MoonBit dependency update failed" }
          moon check --target native posoco-ext-hawdb-session
          if ($LASTEXITCODE -ne 0) { throw "Native typecheck failed" }
      - name: Build and test current upstream HawDB MoonBit Rust adapter
        shell: pwsh
        working-directory: _hawdb_checkout/bindings/moonbit/native
        run: |
          $ErrorActionPreference = "Stop"
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw "Rust formatting failed" }
          cargo test --release --lib
          if ($LASTEXITCODE -ne 0) { throw "Rust lifecycle tests failed" }
          cargo build --release
          if ($LASTEXITCODE -ne 0) { throw "Rust staticlib build failed" }
          if (!(Test-Path target/release/hawdb_moonbit.lib)) { throw "Missing native .lib" }
      - name: Configure and run real Posoco SessionStore native integration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python posoco-ext-hawdb-session/tools/configure_native_link.py --os windows
          if ($LASTEXITCODE -ne 0) { throw "Native linker configuration failed" }
          moon test --target native posoco-ext-hawdb-session
          if ($LASTEXITCODE -ne 0) { throw "Native SessionStore integration failed" }
