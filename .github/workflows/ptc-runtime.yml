name: PTC programmatic runtime
on:
  pull_request:
    paths:
      - "posoco-ext-ptc/**"
      - "moon.work"
      - ".github/workflows/ptc-runtime.yml"
jobs:
  ptc:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "install-moonbit.ps1"
          Invoke-WebRequest -Uri "https://cli.moonbitlang.com/install/powershell.ps1" -OutFile $installer
          & $installer
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:USERPROFILE ".moon\bin")
      - name: Install module dependencies
        run: moon update
      - name: PTC native tests
        run: moon test --target native -p colmugx/posoco-ext-ptc --output-json
      - name: PTC JS tests
        run: moon test --target js -p colmugx/posoco-ext-ptc --output-json
