name: askquestion

on:
  push:
    branches:
      - main
    paths:
      - "posoco-ext-askquestion/**"
      - ".github/workflows/askquestion.yml"
  pull_request:
    paths:
      - "posoco-ext-askquestion/**"
      - ".github/workflows/askquestion.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: versions
        run: |
          moon version --all
          node --version

      - name: update dependencies
        working-directory: posoco-ext-askquestion
        run: moon update

      - name: check and test native
        working-directory: posoco-ext-askquestion
        run: |
          moon check --target native
          moon test --target native
          moon test --release --target native

      - name: check and test JavaScript
        working-directory: posoco-ext-askquestion
        run: |
          moon check --target js
          moon test --target js
          moon test --release --target js

      - name: format and interface
        working-directory: posoco-ext-askquestion
        run: |
          moon fmt
          moon info
          git diff --exit-code
