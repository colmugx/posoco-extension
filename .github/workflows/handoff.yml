name: handoff

on:
  push:
    branches:
      - feat/handoff
    paths:
      - "posoco-ext-handoff/**"
      - ".github/workflows/handoff.yml"
  pull_request:
    paths:
      - "posoco-ext-handoff/**"
      - ".github/workflows/handoff.yml"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: versions
        run: |
          moon version --all
          node --version

      - name: update dependencies
        working-directory: posoco-ext-handoff
        run: moon update

      - name: check and test native
        working-directory: posoco-ext-handoff
        run: |
          moon check --target native --deny-warn
          moon test --target native

      - name: check and test JavaScript
        working-directory: posoco-ext-handoff
        run: |
          moon check --target js --deny-warn
          moon test --target js

      - name: format and interface
        working-directory: posoco-ext-handoff
        run: |
          moon fmt
          moon info

      - name: commit formatter changes
        run: |
          if ! git diff --quiet -- posoco-ext-handoff; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u -- posoco-ext-handoff
            git commit -m "style(handoff): apply moon fmt"
            git push
          fi

      - name: verify tracked source clean
        run: git diff --exit-code -- posoco-ext-handoff
