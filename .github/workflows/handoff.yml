name: handoff

on:
  push:
    branches:
      - feat/handoff
    paths:
      - "posoco-ext-handoff/**"
      - ".github/workflows/handoff.yml"
  pull_request:
    paths:
      - "posoco-ext-handoff/**"
      - ".github/workflows/handoff.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: versions
        run: |
          moon version --all
          node --version

      - name: update dependencies
        working-directory: posoco-ext-handoff
        run: moon update

      - name: check and test native
        working-directory: posoco-ext-handoff
        run: |
          moon check --target native --deny-warn
          moon test --target native

      - name: check and test JavaScript
        working-directory: posoco-ext-handoff
        run: |
          moon check --target js --deny-warn
          moon test --target js

      - name: format and interface
        working-directory: posoco-ext-handoff
        run: |
          moon fmt
          moon info

      - name: upload formatted handoff
        uses: actions/upload-artifact@v4
        with:
          name: formatted-handoff
          path: posoco-ext-handoff
          include-hidden-files: true

      - name: verify formatter clean
        run: git diff --exit-code
