name: PStack package checks

on:
  pull_request:
    paths:
      - "posoco-ext-pstack/**"
      - "posoco-ext-skills/**"
      - "posoco-ext-kind/**"
      - "posoco-ext-workspace/**"
      - "moon.work"
      - ".github/workflows/pstack-check.yml"

jobs:
  pstack:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install moon (Unix)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon version
        run: moon version --all

      - name: moon update
        run: moon update

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: validate PStack assets
        run: node posoco-ext-pstack/scripts/check-assets.mjs

      - name: moon check PStack (native)
        run: moon check --target native posoco-ext-pstack/src

      - name: moon check PStack (js)
        run: moon check --target js posoco-ext-pstack/src

      - name: moon test PStack (native)
        run: moon test --target native posoco-ext-pstack/src

      - name: moon test PStack (js)
        run: moon test --target js posoco-ext-pstack/src
