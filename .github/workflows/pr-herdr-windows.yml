name: herdr Windows native build

on:
  pull_request:
    paths:
      - "posoco-ext-herdr/**"
      - ".github/workflows/pr-herdr-windows.yml"
  push:
    branches: [ main ]
    paths:
      - "posoco-ext-herdr/**"
      - ".github/workflows/pr-herdr-windows.yml"

jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Enable MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install MoonBit
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: MoonBit version
        run: moon version --all
      - name: Update dependencies
        working-directory: posoco-ext-herdr
        run: moon update
      - name: Build native release with MSVC
        working-directory: posoco-ext-herdr
        run: moon build --target native --release
      - name: Run native tests
        working-directory: posoco-ext-herdr
        run: moon test --target native --package posoco/ext-herdr
