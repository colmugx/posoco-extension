name: posoco-extension ci

on:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install moon (Unix)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon version
        run: moon version --all

      - name: moon update
        run: moon update

      # The native host embeds `posoco-ext-board-web/dist` verbatim; it no
      # longer compiles or stitches the browser bundle itself. `npm ci` both
      # provides Vite and keeps the embed step honest: with `node_modules`
      # present it rebuilds the frontend, and without it it refuses a dist
      # older than its sources.
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: install board web dependencies
        run: npm ci --prefix posoco-ext-board-web

      - name: moon check (native)
        run: moon check --target native --output-json

      - name: moon check (js)
        run: moon check --target js --output-json

      - name: moon test (native)
        run: moon test --target native

      - name: moon test (js)
        run: moon test --target js
