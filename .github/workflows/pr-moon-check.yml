name: posoco-extension ci

on:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install moon (Unix)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon version
        run: moon version --all

      - name: moon update
        run: moon update

      # The native host embeds `posoco-ext-board-web/dist` verbatim. Install
      # Vite from the committed Bun lockfile so the embed step can rebuild
      # the frontend instead of accepting an out-of-date bundle.
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: setup bun
        uses: oven-sh/setup-bun@v2

      - name: install board web dependencies
        working-directory: posoco-ext-board-web
        run: bun install --frozen-lockfile

      - name: moon check (native)
        run: moon check --target native --output-json

      - name: moon check (js)
        run: moon check --target js --output-json

      - name: moon test (native)
        run: moon test --target native

      - name: moon test (js)
        run: moon test --target js
