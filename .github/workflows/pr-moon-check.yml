name: posoco-extension ci

on:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install moon (Unix)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon version
        run: moon version --all

      - name: moon update
        run: moon update

      - name: moon check (native)
        run: moon check --target native --output-json

      - name: moon check (js)
        run: moon check --target js --output-json

      - name: DeepSeek generated API signature check
        run: |
          moon info --target native
          if ! git diff --exit-code -- posoco-ext-deepseek/src/pkg.generated.mbti; then
            echo "BEGIN_GENERATED_DEEPSEEK_INTERFACE"
            cat posoco-ext-deepseek/src/pkg.generated.mbti
            echo "END_GENERATED_DEEPSEEK_INTERFACE"
            exit 1
          fi

      - name: DeepSeek adapter unit tests (native)
        run: moon test --target native -p colmugx/posoco-ext-deepseek

      - name: DeepSeek adapter unit tests (js)
        run: moon test --target js -p colmugx/posoco-ext-deepseek

      - name: DeepSeek V4.1 reference renderer contract
        run: |
          python3 -m pip install 'deepseek-recipe>=0.2,<0.3'
          curl -fsSL https://raw.githubusercontent.com/deepseek-ai/deepseek-recipe/main/static/tokenizers/v41/tokenizer.json -o /tmp/deepseek-v41-tokenizer.json
          python3 scripts/deepseek_recipe_golden.py /tmp/deepseek-v41-tokenizer.json
